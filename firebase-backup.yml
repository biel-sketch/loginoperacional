name: Backup Firebase LoginServ

on:
  schedule:
    # Roda todo dia às 03:00 (horário de Brasília, UTC-3) = 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Baixar snapshot completo do Firebase
        run: |
          mkdir -p backups
          DATA=$(date +'%Y-%m-%d_%H-%M')
          curl -s "https://loginserv-painel-default-rtdb.firebaseio.com/.json" \
            -o "backups/backup_${DATA}.json"
          echo "Backup salvo: backup_${DATA}.json"
          # Falha o job se o arquivo vier vazio ou inválido (evita commitar backup quebrado)
          python3 -c "import json,sys; json.load(open('backups/backup_${DATA}.json'))" \
            || (echo "::error::Backup inválido — Firebase pode estar fora do ar" && exit 1)

      - name: Aplicar retenção (últimos 30 dias + 1 por mês)
        run: python3 .github/scripts/retencao_backups.py

      - name: Commitar backup
        run: |
          git config user.name "loginserv-backup-bot"
          git config user.email "actions@github.com"
          git add backups/
          git diff --cached --quiet && echo "Nada para commitar" || git commit -m "Backup automático $(date +'%Y-%m-%d %H:%M')"
          git push
