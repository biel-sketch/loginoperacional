<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Marília Ops — Painel de Presença</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090e13;--bg2:#0f1923;--bg3:#141f2c;--bg4:#1a2535;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.12);
  --text:#ffffff;--text2:#7a92a8;--text3:#4a6070;
  --cyan:#00d4d8;--cyan-bg:rgba(0,212,216,.10);--cyan-bd:rgba(0,212,216,.25);
  --blue:#003B8E;--blue2:#0d6efd;--blue-bg:rgba(13,110,253,.12);--blue-bd:rgba(13,110,253,.25);
  --green:#00e5a0;--green-bg:rgba(0,229,160,.10);--green-bd:rgba(0,229,160,.25);
  --red:#ff4d6a;--red-bg:rgba(255,77,106,.10);--red-bd:rgba(255,77,106,.25);
  --warn:#f59e0b;--warn-bg:rgba(245,158,11,.10);--warn-bd:rgba(245,158,11,.25);
  --purple:#00d4d8;--purple-bg:rgba(0,212,216,.10);--purple-bd:rgba(0,212,216,.25);
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;background-image:radial-gradient(ellipse 60% 50% at 0% 50%,rgba(0,40,80,.45) 0%,transparent 70%);background-attachment:fixed}
.app-shell{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:#0a1220;border-right:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60;transition:width .25s,opacity .25s;overflow:hidden}
.sidebar.collapsed{width:0;opacity:0;border-right:none;pointer-events:none}
.sidebar-toggle{position:fixed;top:50%;transform:translateY(-50%);left:220px;z-index:70;width:20px;height:48px;background:#0a1220;border:1px solid rgba(255,255,255,.1);border-left:none;border-radius:0 8px 8px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--cyan);transition:left .25s}
.sidebar-toggle.col{left:0}
.sidebar-toggle.col i{transform:rotate(180deg)}
.sidebar-logo{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;align-items:center;gap:8px}
.sidebar-logo img{width:80px;object-fit:contain}
.sidebar-unit{font-size:10px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.12em;text-align:center}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.snav-item{display:flex;align-items:center;gap:10px;padding:10px 18px;cursor:pointer;color:var(--text2);font-size:13px;font-weight:600;border:none;background:transparent;width:100%;text-align:left;transition:all .18s;position:relative}
.snav-item i{font-size:17px;flex-shrink:0}
.snav-item:hover:not(.active){background:rgba(255,255,255,.04);color:var(--text)}
.snav-item.active{color:var(--cyan);background:var(--cyan-bg)}
.snav-item.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--cyan);border-radius:0 2px 2px 0}
.sidebar-footer{padding:14px 16px;border-top:1px solid rgba(255,255,255,.06)}
.main-content{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.screens-wrap{flex:1;padding:22px;padding-bottom:40px;overflow-y:auto}
.topbar{background:#0a1220;border-bottom:1px solid rgba(255,255,255,.06);padding:11px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50;display:none}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.sync-dot.syncing{background:var(--warn);animation:pulse 1s infinite}
.sync-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.syncing-spin{animation:spin .7s linear infinite!important}

/* Cards */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;box-shadow:0 1px 20px rgba(0,0,0,.3)}
.card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec{font-size:10px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.15em;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.sec::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--cyan);flex-shrink:0}

/* Posto cards */
.posto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px}
.posto-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:16px;cursor:pointer;transition:all .18s}
.posto-card:hover{border-color:var(--cyan-bd);transform:translateY(-1px)}
.posto-card.descoberto{border-color:var(--red-bd)!important;animation:posto-pulse 2s ease-in-out infinite}
@keyframes posto-pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,106,0)}50%{box-shadow:0 0 0 6px rgba(255,77,106,.15)}}
.posto-card.descoberto .posto-name{color:var(--red)}
.posto-alerta{display:flex;align-items:center;gap:6px;margin-top:10px;padding:7px 10px;background:var(--red-bg);border:1px solid var(--red-bd);border-radius:8px;font-size:11px;color:var(--red);font-weight:700}
.posto-card.selected{border-color:var(--cyan-bd);background:var(--cyan-bg)}
.posto-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.posto-name i{font-size:16px;color:var(--cyan)}
.posto-stats{display:flex;gap:10px;flex-wrap:wrap}
.posto-stat{flex:1;min-width:60px;background:var(--bg3);border-radius:8px;padding:8px 10px;text-align:center}
.posto-stat-val{font-size:20px;font-weight:700;color:var(--text);line-height:1.1}
.posto-stat-lbl{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.posto-stat-val.green{color:var(--green)}
.posto-stat-val.red{color:var(--red)}
.posto-stat-val.warn{color:var(--warn)}
.posto-stat-val.purple{color:var(--cyan)}

/* Colaborador cards in presença */
.colab-pres-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:13px 14px;margin-bottom:8px;transition:all .15s}
.colab-pres-card.folga{border-left:3px solid var(--text3);opacity:.75}
.colab-pres-card.trabalha{border-left:3px solid var(--cyan)}
.colab-pres-card.presente{border-left:3px solid var(--green);background:rgba(0,229,160,.05)}
.colab-pres-card.ausente{border-left:3px solid var(--red);background:rgba(255,77,106,.05)}
.colab-pres-card.extra{border-left:3px solid var(--warn);background:rgba(245,158,11,.05)}
.colab-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:3px}
.colab-info{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.jornada-badge{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700;background:var(--cyan-bg);color:var(--cyan);border:1px solid var(--cyan-bd)}
.ciclo-badge{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:700}
.ciclo-badge.trabalha{background:var(--cyan-bg);color:var(--cyan);border:1px solid var(--cyan-bd)}
.ciclo-badge.folga{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.pres-btns{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pb{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--bg4);color:var(--text2);transition:all .15s;display:flex;align-items:center;gap:4px}
.pb:hover{opacity:.85}
.pb.active-p{background:var(--green-bg);border-color:var(--green-bd);color:var(--green)}
.pb.active-a{background:var(--red-bg);border-color:var(--red-bd);color:var(--red)}
.pb.active-e{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}
.justif-box{margin-top:8px;display:none}
.justif-box input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--warn-bd);background:var(--warn-bg);color:var(--text);font-size:12px;font-family:inherit}
.posto-saved-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--green-bg);border:1px solid var(--green-bd);border-radius:20px;font-size:11px;color:var(--green);font-weight:700;margin-left:8px;animation:fade-in-badge .3s ease}
@keyframes fade-in-badge{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:scale(1)}}

/* KPI grid */
.kpi-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.kpi{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.kpi-lbl{font-size:10px;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.kpi-val{font-size:26px;font-weight:700;color:var(--text);line-height:1.1}
.kpi-val.green{color:var(--green)}.kpi-val.red{color:var(--red)}.kpi-val.purple{color:var(--cyan)}.kpi-val.warn{color:var(--warn)}
.kpi-sub{font-size:11px;margin-top:4px;color:var(--text2)}

/* Buttons */
.btn{width:100%;padding:12px;border:none;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .18s}
.btn-primary{background:var(--blue);color:#fff}
.btn-purple{background:var(--blue);color:#fff}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.btn-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.btn-sm{padding:7px 13px;font-size:12px;width:auto;border-radius:8px}

/* Vtoggle */
.vtoggle{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:4px;gap:4px;margin-bottom:16px}
.vtog{flex:1;padding:8px;border:none;background:transparent;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;border-radius:7px;transition:all .15s}
.vtog.active{background:var(--bg2);color:var(--cyan);box-shadow:0 0 0 1px var(--cyan-bd)}

/* Field */
.field{margin-bottom:13px}
.field label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--cyan);opacity:.8;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 13px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-size:14px;font-family:inherit;transition:border-color .18s}
.field input:focus,.field select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px var(--cyan-bg)}
.field select option{background:#0f1923}

/* Histórico */
.hist-mes-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.hist-mes-nav{display:flex;align-items:center;gap:8px}
.hist-mes-nav button{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px 12px;color:var(--text2);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.hist-mes-nav button:hover{border-color:var(--cyan-bd);color:var(--cyan)}
.hist-mes-label{font-size:15px;font-weight:700;color:var(--text);min-width:140px;text-align:center}
.hist-day-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.hist-day-card.has-falta{border-left:3px solid var(--red)}
.hist-day-card.all-present{border-left:3px solid var(--green)}
.hist-day-date{font-size:12px;font-weight:700;color:var(--text);margin-bottom:8px;text-transform:capitalize}
.hist-turno-row{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.hist-turno-row:last-child{border-bottom:none}
.hist-turno-lbl{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;width:80px;flex-shrink:0;padding-top:2px}
.hist-ausentes{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.hist-ausente-tag{font-size:11px;padding:2px 8px;background:var(--red-bg);border:1px solid var(--red-bd);border-radius:6px;color:var(--red);font-weight:600}
.hist-ok{font-size:11px;color:var(--green);font-weight:600}
.hist-sem-reg{font-size:11px;color:var(--text3);font-style:italic}

/* Abs ranking */
.abs-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.abs-bar-wrap{flex:1;height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;min-width:60px}
.abs-bar{height:100%;border-radius:3px;transition:width .6s}
.badge{display:inline-block;font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700}
.b-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.b-warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}
.b-err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}

/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-box{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:24px;width:100%;max-width:440px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal-title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:18px;display:flex;align-items:center;gap:8px}
.modal-title i{font-size:18px;color:var(--cyan)}
.modal-btns{display:flex;gap:8px;margin-top:18px}
.modal-btn-primary{flex:1;padding:11px;border:none;border-radius:9px;background:var(--blue);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
.modal-btn-danger{padding:11px 16px;border:1px solid var(--red-bd);border-radius:9px;background:var(--red-bg);color:var(--red);font-size:13px;font-weight:700;cursor:pointer}
.modal-btn-ghost{padding:11px 16px;border:1px solid var(--border);border-radius:9px;background:transparent;color:var(--text2);font-size:13px;font-weight:700;cursor:pointer}

/* Colab equipe */
.colab-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.ciclo-calendar{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px;margin-top:10px;display:none}
.ciclo-calendar.open{display:block}
.ciclo-cal-title{font-size:10px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.ciclo-days{display:flex;gap:6px;flex-wrap:wrap}
.ciclo-day{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:36px}
.ciclo-day-num{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.ciclo-day-num.trabalha{background:var(--cyan-bg);color:var(--cyan);border:1px solid var(--cyan-bd)}
.ciclo-day-num.folga{background:var(--bg4);color:var(--text3);border:1px solid var(--border)}
.ciclo-day-num.hoje{outline:2px solid var(--cyan);outline-offset:2px}
.ciclo-day-lbl{font-size:9px;color:var(--text3);text-transform:uppercase}
.ciclo-day-status{font-size:9px;font-weight:700}
.ciclo-day-status.t{color:var(--cyan)}
.ciclo-day-status.f{color:var(--text3)}
.colab-av{width:36px;height:36px;border-radius:50%;background:var(--cyan-bg);color:var(--cyan);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--cyan-bd)}

/* Toast */
.toast{position:fixed;top:16px;right:16px;z-index:9999;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;max-width:300px}
.toast.show{opacity:1}
.toast.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-bd)}
.toast.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-bd)}
.toast.warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd)}

/* Empty */
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty i{font-size:38px;margin-bottom:10px;display:block}
.empty h3{font-size:15px;font-weight:700;color:var(--text2);margin-bottom:5px}
.empty p{font-size:12px;color:var(--text3);line-height:1.5}

.screen{display:none}.screen.active{display:block}
.cfg-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.cfg-lbl{font-size:13px;font-weight:600;color:var(--text)}
.cfg-sub{font-size:11px;color:var(--text2);margin-top:2px}

/* Bottom nav mobile */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:none;z-index:50;visibility:hidden}
.bnav-inner{display:flex;width:100%}
.bn{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;padding:6px 2px 8px;cursor:pointer;color:var(--text3);border:none;background:transparent;font-size:9px;font-weight:700;gap:3px;transition:color .15s;min-width:0}
.bn i{font-size:19px;display:block}.bn span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52px}
.bn.active{color:var(--cyan)}

/* Login */
#login-screen{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px;background-image:radial-gradient(ellipse 70% 60% at 10% 50%,rgba(0,30,60,.6) 0%,transparent 70%)}
.login-box{width:100%;max-width:420px}
.login-card{background:var(--bg2);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:28px;box-shadow:0 8px 40px rgba(0,0,0,.4)}
.btn-login{width:100%;padding:14px;border:none;border-radius:9px;background:var(--blue);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .18s}

/* Day selector */
.day-btns{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.ds-btn{padding:6px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.ds-btn.active{background:var(--cyan-bg);border-color:var(--cyan-bd);color:var(--cyan)}

@media(max-width:768px){
  .sidebar{display:none!important}
  .main-content{width:100%}
  .screens-wrap{padding:10px;padding-bottom:68px}
  .topbar{display:flex!important}
  .bnav{display:flex!important}
  .bnav-inner{padding:3px 0 env(safe-area-inset-bottom,3px)}
  .bn{display:flex}
  .kpi-grid-4{grid-template-columns:repeat(2,1fr);gap:8px}
  .posto-grid{grid-template-columns:1fr}
  .sidebar-toggle{display:none!important}
}
@media(min-width:769px){.bnav{display:none!important}.topbar{display:none!important}}
</style>

<body>
<div id="login-screen">
  <div class="login-box"><div class="login-card">
    <div style="text-align:center;margin-bottom:20px">
      <img id="login-logo" src="" alt="Logo" style="height:68px;object-fit:contain;margin:0 auto 10px;display:block">
      <div style="font-size:20px;font-weight:700">Marília Ops — Presença</div>
      <div style="font-size:13px;color:var(--text2);margin-top:4px;margin-bottom:20px">Entre com seu usuário e senha</div>
    </div>
    <div class="field"><label>Usuário</label><input type="text" id="login-user" placeholder="Seu nome..." onkeydown="if(event.key==='Enter')document.getElementById('login-pw').focus()"></div>
    <div class="field"><label>Senha</label><input type="password" id="login-pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div id="login-err" style="color:var(--red);font-size:12px;margin-bottom:10px;min-height:16px"></div>
    <button class="btn-login" onclick="doLogin()"><i class="ti ti-login" style="font-size:16px;vertical-align:-2px"></i> Entrar</button>
  </div></div>
</div>

<div id="app" style="display:none">
  <div class="app-shell">
    <button class="sidebar-toggle" id="sidebar-toggle" onclick="toggleSidebar()">
      <i class="ti ti-chevron-left" id="stoggle-icon"></i>
    </button>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <img id="sidebar-logo" src="" alt="Logo">
        <div class="sidebar-unit">Marília Ops</div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <button class="snav-item active" id="snav-dashboard" onclick="goTo('dashboard')"><i class="ti ti-layout-dashboard"></i>Dashboard</button>
        <button class="snav-item" id="snav-presenca" onclick="goTo('presenca')"><i class="ti ti-users"></i>Presença</button>
        <button class="snav-item" id="snav-historico" onclick="goTo('historico')"><i class="ti ti-calendar"></i>Histórico</button>
        <button class="snav-item" id="snav-absenteismo" onclick="goTo('absenteismo')"><i class="ti ti-user-off"></i>Absenteísmo</button>
        <button class="snav-item" id="snav-equipe" onclick="goTo('equipe')"><i class="ti ti-id-badge"></i>Equipe</button>
        <button class="snav-item" id="snav-config" onclick="goTo('config')"><i class="ti ti-settings"></i>Config</button>
      </nav>
      <div class="sidebar-footer">
        <div style="display:flex;align-items:center;gap:9px;margin-bottom:10px" id="sidebar-user-block"></div>
        <div style="display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);margin-bottom:8px" id="sync-bar">
          <div class="sync-dot" id="sync-dot"></div>
          <span style="font-size:11px;color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="sync-label">Conectando...</span>
          <button onclick="manualSync()" style="background:none;border:none;cursor:pointer;padding:2px;color:var(--text3);display:flex"><i class="ti ti-refresh" style="font-size:14px" id="sync-icon"></i></button>
        </div>
        <div style="height:2px;background:var(--border);border-radius:1px;overflow:hidden;margin-bottom:4px"><div id="sync-progress" style="height:100%;width:0%;background:var(--green);border-radius:1px;transition:width .3s"></div></div>
        <div style="font-size:10px;color:var(--text3);text-align:center;margin-bottom:10px" id="sync-next-lbl"></div>
        <button class="btn btn-ghost" style="padding:8px;font-size:12px" onclick="confirmarLogout()"><i class="ti ti-logout" style="font-size:14px"></i> Sair</button>
      </div>
    </aside>

    <div class="main-content">
      <!-- Mobile topbar -->
      <div class="topbar" style="position:relative">
        <img id="topbar-logo" src="" alt="Logo" style="height:24px;object-fit:contain">
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700" id="topbar-title">Dashboard</div>
          <div style="display:flex;align-items:center;gap:4px;margin-top:1px">
            <div class="sync-dot" id="sync-dot-mob"></div>
            <span style="font-size:10px;color:var(--text2)" id="sync-label-mob">Conectando...</span>
          </div>

const POSTO_ICONS = {'Acim':'ti-briefcase','Americas':'ti-building-community','ClinicPrev':'ti-heart-rate-monitor','Dallas':'ti-gas-station','Dori':'ti-leaf','Emdurb':'ti-traffic-lights','Grespan':'ti-chef-hat','Jazam':'ti-leaf','Mirai Marilia':'ti-car-garage','Mirai Tupa':'ti-car-garage','Moradas':'ti-building-community','Mustache':'ti-device-desktop','Pib':'ti-church','Prever':'ti-briefcase','Ravena':'ti-building-community','TSERVICE':'ti-car','Tamoyo':'ti-building-factory','Velocity':'ti-barbell'};

const USERS = [
  {user:'Gustavo',   senha:'LoginBH26',  role:'gestor'},
  {user:'Carol',     senha:'Login@982',  role:'admin'},
  {user:'Guilherme', senha:'Login@982',  role:'superadmin'},

// === STATE ===
let state = {colaboradores:[], presencas:{}};
let currentUser=null, currentRole=null;
let isSyncing=false, lastSync=null, syncTimer=null;
function colaboradoresAtivos(){ return state.colaboradores.filter(c=>c.ativo!==false); }
function markPending(){ try{ localStorage.setItem(LS_CACHE+'_pending','1'); }catch(e){} }
function clearPending(){ try{ localStorage.removeItem(LS_CACHE+'_pending'); }catch(e){} }
function hasPending(){ try{ return localStorage.getItem(LS_CACHE+'_pending')==='1'; }catch(e){ return false; } }

// === UTILS ===
function today(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dateFmt(d){
  if(!d)return'';
  const p=d.split('-');
  const dias=['dom','seg','ter','qua','qui','sex','sab'];
  return dias[new Date(d+'T12:00').getDay()]+', '+p[2]+'/'+p[1];
}
function dateFull(d){
  if(!d)return'';
  return new Date(d+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}
function isFimSemanaOuFeriado(dateStr){
  const dow=new Date(dateStr+'T12:00').getDay();
  return dow===0||dow===6; // simplificado - feriados podem ser adicionados
}
function showToast(msg,type='ok',dur=3000){
  const t=document.getElementById('app-toast');if(!t)return;
  t.textContent=msg;t.className='toast show '+type;
  setTimeout(()=>{t.className='toast';},dur);
}

// === CICLO 12x36 ===
function calcCiclo(colab, dateStr){
  if(!colab.inicioCiclo) return {status:'indefinido'};
  const inicio = new Date(colab.inicioCiclo+'T12:00');
  const alvo   = new Date(dateStr+'T12:00');
  const diffMs = alvo - inicio;
  const diffDias = Math.round(diffMs/(1000*60*60*24));
  // 12x36 = trabalha 1 dia, folga 1 dia (baseado em ciclo de 2 dias)
  const trabalha = diffDias >= 0 && diffDias % 2 === 0;
  return {trabalha, diffDias, diaCiclo: diffDias % 2};
}

function deveTrabalharHoje(colab, dateStr){
  // Regras especiais por posto
  const especial = POSTO_ESPECIAL[colab.posto];
  if(especial && especial.soFimSemana){
    return isFimSemanaOuFeriado(dateStr);
  }
  const ciclo = calcCiclo(colab, dateStr);
  if(!colab.inicioCiclo) return true; // sem ciclo, sempre aparece
  return ciclo.trabalha;
}

// === FIREBASE ===
async function fbGet(){
  const r=await fetch(FB_URL_MARILIA_OPS);
  if(!r.ok)throw new Error(r.status);
  return r.json();
}
async function fbPut(data){
  const r=await fetch(FB_URL_MARILIA_OPS,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  if(!r.ok)throw new Error(r.status);
  return r.json();
}

// === CACHE ===
function saveCache(){
  try{
    localStorage.setItem(LS_CACHE, JSON.stringify(state));
    localStorage.setItem('marilia_ops_cache_ts', Date.now());
  }catch(e){}
}
function loadCache(){
  try{
    const c=localStorage.getItem(LS_CACHE);
    if(c){
      const p=JSON.parse(c);
      if(p.colaboradores&&p.colaboradores.length) state.colaboradores=p.colaboradores;
      if(p.presencas) state.presencas=p.presencas;
    }
  }catch(e){}
}

// === SYNC ===
function mergeState(cloud){
  if(!cloud)return;
  if(cloud.colaboradores&&cloud.colaboradores.length) state.colaboradores=cloud.colaboradores;
  if(cloud.presencas) state.presencas=cloud.presencas;
}

async function syncFromCloud(){
  if(isSyncing)return;
  isSyncing=true;
  // Se há alterações locais que ainda não foram enviadas (ex: feitas offline),
  // envia-las primeiro com merge seguro, em vez de sobrescrever o estado local
  // com o que está na nuvem — evita perder o que foi feito offline ao reconectar.
  if(hasPending()){
    isSyncing=false;
    await pushToCloud();
    return;
  }
  setSyncDot('syncing','Sincronizando...');
  try{
    const data=await fbGet();
    if(data) mergeState(data);
    saveCache();
    lastSync=new Date();
    setSyncDot('ok','Sincronizado '+lastSync.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    saveCache();
    setSyncDot('err','Sem conexão');
    console.error('Sync:',e);
  }
  isSyncing=false;
  renderAll();
}

async function pushToCloud(){
  setSyncDot('syncing','Salvando...');
  try{
    let merged={colaboradores:state.colaboradores,presencas:state.presencas};
    try{
      const cloud=await fbGet();
      if(cloud){
        const mp=JSON.parse(JSON.stringify(cloud.presencas||{}));
        Object.entries(state.presencas).forEach(([d,postos])=>{
          if(!mp[d])mp[d]={};
          Object.entries(postos).forEach(([posto,colabs])=>{
            if(!mp[d][posto])mp[d][posto]={};
            Object.entries(colabs).forEach(([nome,v])=>{
              mp[d][posto][nome]=v;
            });
          });
        });
        // Merge colaboradores por nome: mantém edições/adições locais, mas
        // preserva quem outro usuário cadastrou na nuvem entre o último sync e agora
        const cloudColabs=cloud.colaboradores||[];
        const localNomes=new Set(state.colaboradores.map(c=>c.nome));
        const mergedColabs=[...state.colaboradores];
        cloudColabs.forEach(cc=>{ if(!localNomes.has(cc.nome)) mergedColabs.push(cc); });
        merged={colaboradores:mergedColabs,presencas:mp};
      }
    }catch(e){}
    await fbPut(merged);
    state.colaboradores=merged.colaboradores;
    state.presencas=merged.presencas;
    clearPending();
    saveCache();
    lastSync=new Date();
    setSyncDot('ok','Salvo '+lastSync.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
    renderAll();
  }catch(e){
    markPending();
    saveCache();
    setSyncDot('err','Alterações pendentes — sem conexão');
    console.error('Push:',e);
  }
}

async function pushForceToCloud(){
  setSyncDot('syncing','Salvando...');
  try{
    await fbPut({colaboradores:state.colaboradores,presencas:state.presencas});
    clearPending();
    saveCache();
    lastSync=new Date();
    setSyncDot('ok','Salvo '+lastSync.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    markPending();
    saveCache();
    setSyncDot('err','Alterações pendentes — sem conexão');
  }
}

function startAutoSync(){syncFromCloud().then(scheduleNext).catch(scheduleNext);}
function scheduleNext(){if(syncTimer)clearTimeout(syncTimer);syncTimer=setTimeout(startAutoSync,SYNC_INTERVAL);}
function manualSync(){if(syncTimer)clearTimeout(syncTimer);syncFromCloud().then(scheduleNext).catch(scheduleNext);}

window.addEventListener('online', ()=>{
  if(currentUser) manualSync();
});
window.addEventListener('offline', ()=>{
  setSyncDot('err','Sem conexão');
});

// === SYNC DOT ===
function setSyncDot(s,label){
  ['sync-dot','sync-dot-mob'].forEach(id=>{
    const d=document.getElementById(id);if(!d)return;
    d.className='sync-dot'+(s==='ok'?'':s==='syncing'?' syncing':' err');
  });
  ['sync-label','sync-label-mob'].forEach(id=>{
    const l=document.getElementById(id);if(l)l.textContent=label;
  });
  ['sync-icon','sync-icon-mob'].forEach(id=>{
    const el=document.getElementById(id);if(!el)return;
    s==='syncing'?el.classList.add('syncing-spin'):el.classList.remove('syncing-spin');
  });
  const sb=document.getElementById('sync-bar');
  if(sb){
    sb.style.borderColor=s==='ok'?'var(--green-bd)':s==='syncing'?'var(--blue-bd)':'var(--red-bd)';
    sb.style.background=s==='ok'?'rgba(0,229,160,.07)':s==='syncing'?'rgba(13,110,253,.07)':'rgba(255,77,106,.07)';
  }
  ['sync-progress','sync-prog-mob'].forEach(pid=>{
    const p=document.getElementById(pid);if(!p)return;
    p.style.background=s==='ok'?'var(--green)':s==='syncing'?'var(--blue2)':'var(--red)';
    if(s==='syncing'){p.style.transition='width 1.5s';p.style.width='70%';}
    else if(s==='ok'){p.style.transition='width .3s';p.style.width='100%';setTimeout(()=>{if(p){p.style.transition='width 1.5s';p.style.width='0%';}},1000);}
    else{p.style.transition='width .3s';p.style.width='100%';setTimeout(()=>{if(p){p.style.transition='width 1s';p.style.width='0%';}},2000);}
  });
  if(countdownTimer)clearInterval(countdownTimer);
  const nl=document.getElementById('sync-next-lbl');
  if(s==='ok'&&nl){
    syncCountdown=Math.round(SYNC_INTERVAL/1000);
    nl.textContent='próxima em '+syncCountdown+'s';
    countdownTimer=setInterval(()=>{
      syncCountdown--;
      if(syncCountdown<=0){clearInterval(countdownTimer);if(nl)nl.textContent='atualizando...';}
      else if(nl)nl.textContent='próxima em '+syncCountdown+'s';
    },1000);
  }else if(nl)nl.textContent='';
}

}

function toggleSidebar(){

function launchApp(){
  const bnav=document.querySelector('.bnav');if(bnav)bnav.style.visibility='visible';
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='block';
  updateUserDisplay();
  selDate=today();

  ['sidebar-logo','topbar-logo','login-logo'].forEach(id=>{const el=document.getElementById(id);if(el)el.src=LOGO_B64;});
  try{localStorage.setItem('marilia_ops_cache_ts',Date.now());}catch(e){}
  saveCache();
  goTo('dashboard');
  startAutoSync();
}
function boot(){
  loadCache();
  try{
    const raw=sessionStorage.getItem('marilia_ops_session')||localStorage.getItem('marilia_ops_session');
    if(raw){
      const sess=JSON.parse(raw);
      if((Date.now()-(sess.loginAt||0))<=7*24*60*60*1000&&sess.user){
        const found=USERS.find(u=>u.user===sess.user)||USERS.find(u=>u.user.toLowerCase()===sess.user.toLowerCase());
        if(found){currentUser=found;currentRole=found.role;launchApp();return;}
      }
      localStorage.removeItem('marilia_ops_session');
    }
  }catch(e){}
  const el=document.getElementById('login-logo');if(el)el.src=LOGO_B64;
  showLoginScreen();
}
window.addEventListener('DOMContentLoaded',boot);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeColabModal();closeJustifModal();}});

// === NAVIGATION ===
const SCREEN_TITLES={dashboard:'Dashboard',presenca:'Presença',historico:'Histórico',absenteismo:'Absenteísmo',equipe:'Equipe',config:'Config'};
function goTo(sc){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.bn,.snav-item').forEach(b=>b.classList.remove('active'));
  const scEl=document.getElementById('sc-'+sc);if(scEl)scEl.classList.add('active');
  const bnEl=document.getElementById('bn-'+sc);if(bnEl)bnEl.classList.add('active');
  const snEl=document.getElementById('snav-'+sc);if(snEl)snEl.classList.add('active');
  const tt=document.getElementById('topbar-title');if(tt)tt.textContent=SCREEN_TITLES[sc]||sc;
  if(sc==='dashboard')  renderDashboard();
  if(sc==='presenca')   renderPresenca();
  if(sc==='historico')  renderHistorico();
  if(sc==='absenteismo')renderAbsenteismo();
  if(sc==='equipe')     renderEquipe();
  if(sc==='config')     renderConfig();
}
function renderAll(){
  const cur=document.querySelector('.screen.active');if(!cur)return;
  const id=cur.id.replace('sc-','');
  if(id==='dashboard')  renderDashboard();
  if(id==='presenca')   renderPresenca();
  if(id==='historico')  renderHistorico();
  if(id==='absenteismo')renderAbsenteismo();
}
</script>

<script>
// === DASHBOARD ===
function renderDashboard(){
  const cont=document.getElementById('dash-content');if(!cont)return;
  const todayD=today();
  const presDay=state.presencas[todayD]||{};
  const isFDS=isFimSemanaOuFeriado(todayD);

  let totalEscalados=0,totalPresentes=0,totalAusentes=0,totalFolga=0;
  let gridHtml='<div class="posto-grid">';

  POSTOS.forEach(posto=>{
    const especial=POSTO_ESPECIAL[posto];

    const colabsPostoHoje=colaboradoresAtivos().filter(c=>c.posto===posto&&deveTrabalharHoje(c,todayD));
    const colabsExtra=colaboradoresAtivos().filter(c=>{
      if(c.posto!==posto)return false;
      const pres=presDay[posto]&&presDay[posto][c.nome];
      return pres&&pres.status==='E'; // extra (trabalhando na folga)
    });
    const todosColabsPosto=[...new Set([...colabsPostoHoje,...colabsExtra])];
    const presPostoData=presDay[posto]||{};
    let presentes=0,ausentes=0,escalados=todosColabsPosto.length;
    todosColabsPosto.forEach(c=>{
      const pres=presPostoData[c.nome];
      if(pres){if(pres.status==='P'||pres.status==='E')presentes++;else if(pres.status==='A')ausentes++;}
    });
    totalEscalados+=escalados;totalPresentes+=presentes;totalAusentes+=ausentes;
    totalFolga+=colaboradoresAtivos().filter(c=>c.posto===posto&&!deveTrabalharHoje(c,todayD)).length;
    const pctPres=escalados>0?Math.round(presentes/escalados*100):0;
    const pctColor=pctPres===100?'var(--green)':pctPres>=70?'var(--warn)':'var(--red)';
    gridHtml+='<div class="posto-card" onclick="irParaPostoPresenca(\''+posto+'\')">';
    gridHtml+='<div class="posto-name"><i class="ti '+POSTO_ICONS[posto]+'"></i>'+POSTOS_LABEL[posto]+'</div>';
    gridHtml+='<div class="posto-stats">';
    gridHtml+='<div class="posto-stat"><div class="posto-stat-val purple">'+escalados+'</div><div class="posto-stat-lbl">Escalados</div></div>';
    gridHtml+='<div class="posto-stat"><div class="posto-stat-val green">'+presentes+'</div><div class="posto-stat-lbl">Presentes</div></div>';
    gridHtml+='<div class="posto-stat"><div class="posto-stat-val red">'+ausentes+'</div><div class="posto-stat-lbl">Ausentes</div></div>';
    gridHtml+='</div>';
    if(escalados>0){
      gridHtml+='<div style="margin-top:10px"><div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-bottom:4px"><span>Presença</span><span style="color:'+pctColor+';font-weight:700">'+pctPres+'%</span></div>';
      gridHtml+='<div style="height:4px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+pctPres+'%;background:'+pctColor+';border-radius:2px;transition:width .6s"></div></div></div>';
    }
    gridHtml+='<div style="font-size:10px;color:var(--cyan);margin-top:8px;font-weight:600">Ver detalhes →</div>';
    gridHtml+='</div>';
  });

  gridHtml+='</div>';

  // Montagem final em ordem linear: data > KPIs > título > grid de postos
  let html='<div style="font-size:13px;color:var(--text2);margin-bottom:16px">'+dateFull(todayD)+(isFDS?' <span class="badge" style="background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-bd);margin-left:6px">Fim de semana</span>':'')+'</div>';
  html+='<div class="kpi-grid-4" style="margin-bottom:16px">'+
    '<div class="kpi"><div class="kpi-lbl">Escalados hoje</div><div class="kpi-val purple">'+totalEscalados+'</div></div>'+
    '<div class="kpi"><div class="kpi-lbl">Presentes</div><div class="kpi-val green">'+totalPresentes+'</div></div>'+
    '<div class="kpi"><div class="kpi-lbl">Ausentes</div><div class="kpi-val red">'+totalAusentes+'</div></div>'+
    '<div class="kpi"><div class="kpi-lbl">Em folga</div><div class="kpi-val" style="color:var(--text3)">'+totalFolga+'</div></div>'+
    '</div>'+
    '<div class="sec">Postos</div>'+
    gridHtml;

  cont.innerHTML=html;
}

function irParaPostoPresenca(posto){
  selPosto=posto;
  goTo('presenca');
  // Update filter button
  setTimeout(()=>{
    document.querySelectorAll('.posto-filter-btn').forEach(b=>b.classList.remove('active'));
    const btn=document.querySelector('.posto-filter-btn[data-posto="'+posto+'"]');
    if(btn)btn.classList.add('active');
    renderPresContent();
  },50);
}

// === PRESENÇA ===
function setPresView(v){
  presView=v;
  document.getElementById('ptog-hoje').className='vtog'+(v==='hoje'?' active':'');
  document.getElementById('ptog-hist').className='vtog'+(v==='historico'?' active':'');
  document.getElementById('pv-hoje').style.display=v==='hoje'?'block':'none';
  document.getElementById('pv-historico').style.display=v==='historico'?'block':'none';
  if(v==='historico') renderPresHist();
}

function renderPresenca(){
  document.getElementById('pres-date-lbl').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
  // Posto filter buttons
  const fbtns=document.getElementById('posto-filter-btns');
  if(fbtns){
    let html='<button class="ds-btn'+(selPosto===null?' active':'')+'" onclick="selPostoFiltro(null)">Todos</button>';
    POSTOS.forEach(p=>{html+='<button class="ds-btn posto-filter-btn'+(selPosto===p?' active':'')+'" data-posto="'+p+'" onclick="selPostoFiltro(\''+p+'\')">'+POSTOS_LABEL[p]+'</button>';});
    fbtns.innerHTML=html;
  }
  renderPresContent();
}

function selPostoFiltro(posto){
  selPosto=posto;
  document.querySelectorAll('#posto-filter-btns .ds-btn').forEach(b=>b.classList.remove('active'));
  const target=posto===null?document.querySelector('#posto-filter-btns .ds-btn'):document.querySelector('.posto-filter-btn[data-posto="'+posto+'"]');
  if(target)target.classList.add('active');
  renderPresContent();
}

function renderPresContent(){
  const cont=document.getElementById('pres-content');if(!cont)return;
  const todayD=today();
  const presDay=state.presencas[todayD]||{};
  const isFDS=isFimSemanaOuFeriado(todayD);
  const postosVisiveis=selPosto?[selPosto]:POSTOS;
  let html='';

  postosVisiveis.forEach(posto=>{
    const especial=POSTO_ESPECIAL[posto];


    const colabsPosto=colaboradoresAtivos().filter(c=>c.posto===posto);
    if(!colabsPosto.length){
      html+='<div class="card"><div class="card-title"><i class="ti '+POSTO_ICONS[posto]+'" style="color:var(--cyan)"></i>'+POSTOS_LABEL[posto]+'</div><div class="empty" style="padding:16px 0"><i class="ti ti-users" style="font-size:24px"></i><p>Nenhum colaborador cadastrado neste posto.</p></div></div>';
      return;
    }

    const presPostoData=presDay[posto]||{};
    // Separate: working today by cycle, on leave, and extra workers
    const escalados=colabsPosto.filter(c=>deveTrabalharHoje(c,todayD));
    const folga=colabsPosto.filter(c=>!deveTrabalharHoje(c,todayD));

    let presentes=0,ausentes=0;
    escalados.forEach(c=>{const p=presPostoData[c.nome];if(p){if(p.status==='P')presentes++;else if(p.status==='A')ausentes++;}});

    html+='<div class="card" style="margin-bottom:14px">';
    html+='<div class="card-title"><i class="ti '+POSTO_ICONS[posto]+'" style="color:var(--cyan)"></i>'+POSTOS_LABEL[posto];
    html+='<span style="margin-left:auto;font-size:11px;color:var(--text2);font-weight:400">'+escalados.length+' escalados · <span style="color:var(--green)">'+presentes+' pres.</span>'+(ausentes>0?' · <span style="color:var(--red)">'+ausentes+' aus.</span>':'')+'</span></div>';

    // Escalados section
    if(escalados.length){
      html+='<div style="font-size:10px;font-weight:700;color:var(--cyan);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px">Escalados hoje</div>';
      escalados.forEach(c=>{
        const pres=presPostoData[c.nome];
        const status=pres?pres.status:'';
        const cardCls=status==='P'?'presente':status==='A'?'ausente':status==='E'?'extra':'trabalha';
        html+='<div class="colab-pres-card '+cardCls+'">';
        html+='<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">';
        html+='<div><div class="colab-name">'+c.nome+'</div>';
        html+='<div class="colab-info"><span class="jornada-badge">'+JORNADAS[c.jornada]+'</span>'+(c.cargo?'<span style="font-size:11px;color:var(--text3)">'+c.cargo+'</span>':'')+'</div></div>';
        html+='<div class="pres-btns">';
        html+='<button class="pb'+(status==='P'?' active-p':'')+'" onclick="setStatus(\''+posto+'\',\''+c.nome+'\',\'P\')"><i class="ti ti-check" style="font-size:12px"></i> Presente</button>';
        html+='<button class="pb'+(status==='A'?' active-a':'')+'" onclick="setStatus(\''+posto+'\',\''+c.nome+'\',\'A\')"><i class="ti ti-x" style="font-size:12px"></i> Ausente</button>';
        html+='</div></div>';
        if(pres&&pres.justificativa){html+='<div style="font-size:11px;color:var(--warn);margin-top:6px"><i class="ti ti-info-circle" style="font-size:11px"></i> '+pres.justificativa+'</div>';}
        html+='</div>';
      });
    }

    // Folga section (collapsed by default, expandable)
    if(folga.length){
      html+='<div style="margin-top:12px">';
      html+='<div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between">';
      html+='<span>De folga hoje ('+folga.length+')</span>';
      html+='<button onclick="toggleFolgaSection(\'folga-'+posto.replace(/ /g,'-')+'\')" style="background:none;border:none;color:var(--text3);font-size:11px;cursor:pointer;font-weight:700">ver/ocultar</button></div>';
      html+='<div id="folga-'+posto.replace(/ /g,'-')+'" style="display:none">';
      folga.forEach(c=>{
        const pres=presPostoData[c.nome];
        const status=pres?pres.status:'';
        const cardCls=status==='E'?'extra':'folga';
        html+='<div class="colab-pres-card '+cardCls+'">';
        html+='<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">';
        html+='<div><div class="colab-name">'+c.nome+' <span class="ciclo-badge folga">Folga 12x36</span></div>';
        html+='<div class="colab-info"><span class="jornada-badge">'+JORNADAS[c.jornada]+'</span></div></div>';
        html+='<div class="pres-btns">';
        html+='<button class="pb'+(status==='E'?' active-e':'')+'" onclick="lancarExtra(\''+posto+'\',\''+c.nome+'\')"><i class="ti ti-plus" style="font-size:12px"></i> Trabalho extra</button>';
        if(status==='E')html+='<button class="pb" onclick="setStatus(\''+posto+'\',\''+c.nome+'\',\'\')"><i class="ti ti-x" style="font-size:12px"></i> Cancelar</button>';
        html+='</div></div>';
        if(pres&&pres.justificativa){html+='<div style="font-size:11px;color:var(--warn);margin-top:6px"><i class="ti ti-info-circle" style="font-size:11px"></i> '+pres.justificativa+(pres.obs?' — '+pres.obs:'')+'</div>';}
        html+='</div>';
      });
      html+='</div></div>';
    }

    html+='</div>';
  });

  if(!html) html='<div class="empty"><i class="ti ti-users"></i><h3>Nenhum colaborador cadastrado</h3><p>Adicione colaboradores na tela Equipe.</p></div>';
  cont.innerHTML=html;
}

function toggleFolgaSection(id){
  const el=document.getElementById(id);
  if(el)el.style.display=el.style.display==='none'?'block':'none';
}

async function setStatus(posto,nome,status){
  const todayD=today();
  if(!state.presencas[todayD])state.presencas[todayD]={};
  if(!state.presencas[todayD][posto])state.presencas[todayD][posto]={};
  if(status===''){
    delete state.presencas[todayD][posto][nome];
  }else{
    state.presencas[todayD][posto][nome]={status,ts:new Date().toISOString(),who:currentUser?currentUser.user:'?'};
  }
  saveCache();
  renderPresContent();
  renderDashboard();
  // Show saved indicator on posto card title
  showPostoSaved(posto);
  await pushToCloud();
  verificarAusenciaLins();
}

function showPostoSaved(posto){
  // Find posto card title and add a temporary saved badge
  const titles = document.querySelectorAll('.card-title');
  titles.forEach(t=>{
    if(t.textContent.includes(POSTOS_LABEL[posto]||posto)){
      // Remove existing badge if any
      const existing = t.querySelector('.posto-saved-badge');
      if(existing) existing.remove();
      const badge = document.createElement('span');
      badge.className = 'posto-saved-badge';
      badge.innerHTML = '<i class="ti ti-circle-check" style="font-size:12px"></i> Salvo';
      t.appendChild(badge);
      setTimeout(()=>{ if(badge.parentNode) badge.remove(); }, 3000);
    }
  });
}

// === EXTRA (trabalho na folga) ===
let _justifPosto=null,_justifNome=null;
function lancarExtra(posto,nome){
  _justifPosto=posto;_justifNome=nome;
  document.getElementById('justif-colab-name').textContent=nome;
  document.getElementById('justif-tipo').value='Troca de folga';
  document.getElementById('justif-obs').value='';
  document.getElementById('justif-modal').style.display='flex';
}
function closeJustifModal(){document.getElementById('justif-modal').style.display='none';}
async function confirmarExtraComJustif(){
  const tipo=document.getElementById('justif-tipo').value;
  const obs=document.getElementById('justif-obs').value.trim();
  const todayD=today();
  if(!state.presencas[todayD])state.presencas[todayD]={};
  if(!state.presencas[todayD][_justifPosto])state.presencas[todayD][_justifPosto]={};
  state.presencas[todayD][_justifPosto][_justifNome]={
    status:'E',justificativa:tipo,obs,
    ts:new Date().toISOString(),who:currentUser?currentUser.user:'?'
  };
  closeJustifModal();
  showToast('Trabalho extra registrado!','ok');
  saveCache();renderPresContent();renderDashboard();
  showPostoSaved(_justifPosto);
  await pushToCloud();
}

// === HISTÓRICO ===
function renderHistorico(){
  const cont=document.getElementById('hist-content');if(!cont)return;
  if(!histMes){const d=new Date();histMes=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
  renderHistMes();
}
function navHistMes(d){
  const [y,m]=histMes.split('-').map(Number);
  const nd=new Date(y,m-1+d,1);
  histMes=nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0');
  renderHistMes();
}
function renderHistMes(){
  const cont=document.getElementById('hist-content');if(!cont)return;
  const [y,m]=histMes.split('-').map(Number);
  const mesLabel=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const curYM=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
  const dates=Object.keys(state.presencas).filter(d=>d.startsWith(histMes)).sort().reverse();

  let html='<div class="hist-mes-header"><div class="hist-mes-nav">';
  html+='<button onclick="navHistMes(-1)"><i class="ti ti-chevron-left" style="font-size:13px"></i></button>';
  html+='<div class="hist-mes-label">'+mesLabel+'</div>';
  html+='<button onclick="navHistMes(1)"'+(histMes>=curYM?' disabled style="opacity:.4"':'')+'>'+
    '<i class="ti ti-chevron-right" style="font-size:13px"></i></button></div>';
  html+='<div style="font-size:12px;color:var(--text2)">'+dates.length+' dia(s)</div></div>';

  if(!dates.length){
    html+='<div class="empty"><i class="ti ti-calendar-off"></i><h3>Nenhum registro em '+mesLabel+'</h3></div>';
    document.getElementById('hist-content').innerHTML=html;return;
  }

  dates.forEach(date=>{
    const presDay=state.presencas[date]||{};
    const weekday=new Date(date+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});
    let hasFalta=false;
    let postosHtml='';

    POSTOS.forEach(posto=>{
      const presPostoData=presDay[posto];
      if(!presPostoData||!Object.keys(presPostoData).length)return;
      const ausentes=Object.entries(presPostoData).filter(([,v])=>v.status==='A').map(([n])=>n.split(' ').slice(0,2).join(' '));
      const presentes=Object.values(presPostoData).filter(v=>v.status==='P'||v.status==='E').length;
      if(ausentes.length)hasFalta=true;
      postosHtml+='<div class="hist-turno-row">';
      postosHtml+='<span class="hist-turno-lbl">'+POSTOS_LABEL[posto]+'</span>';
      postosHtml+='<div class="hist-ausentes">';
      if(ausentes.length){
        ausentes.forEach(n=>{postosHtml+='<span class="hist-ausente-tag">'+n+'</span>';});
        postosHtml+='<span style="font-size:11px;color:var(--text2);margin-left:4px">'+presentes+' pres.</span>';
      }else{
        postosHtml+='<span class="hist-ok"><i class="ti ti-check" style="font-size:11px"></i> '+presentes+' presente(s)</span>';
      }
      postosHtml+='</div></div>';
    });

    if(!postosHtml)return;
    html+='<div class="hist-day-card '+(hasFalta?'has-falta':'all-present')+'">';
    html+='<div class="hist-day-date">'+weekday+'</div>';
    html+=postosHtml+'</div>';
  });

  document.getElementById('hist-content').innerHTML=html;
}

// === HISTÓRICO PRESENÇA (aba na tela de presença) ===
let presHistMes=null;
function renderPresHist(){
  if(!presHistMes){const d=new Date();presHistMes=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
  const cont=document.getElementById('pres-hist-content');if(!cont)return;
  // Reuse same logic as renderHistMes but in different container
  const [y,m]=presHistMes.split('-').map(Number);
  const mesLabel=new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const curYM=new Date().getFullYear()+'-'+String(new Date().getMonth()+1).padStart(2,'0');
  const dates=Object.keys(state.presencas).filter(d=>d.startsWith(presHistMes)).sort().reverse();

  let html='<div class="hist-mes-header"><div class="hist-mes-nav">';
  html+='<button onclick="navPresHistMes(-1)"><i class="ti ti-chevron-left" style="font-size:13px"></i></button>';
  html+='<div class="hist-mes-label">'+mesLabel+'</div>';
  html+='<button onclick="navPresHistMes(1)"'+(presHistMes>=curYM?' disabled style="opacity:.4"':'')+'>'+
    '<i class="ti ti-chevron-right" style="font-size:13px"></i></button></div>';
  html+='<div style="font-size:12px;color:var(--text2)">'+dates.length+' dia(s)</div></div>';

  if(!dates.length){html+='<div class="empty"><i class="ti ti-calendar-off"></i><h3>Nenhum registro em '+mesLabel+'</h3></div>';cont.innerHTML=html;return;}

  dates.forEach(date=>{
    const presDay=state.presencas[date]||{};
    const weekday=new Date(date+'T12:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});
    let hasFalta=false,posHtml='';
    POSTOS.forEach(posto=>{
      const pd=presDay[posto];if(!pd||!Object.keys(pd).length)return;
      const aus=Object.entries(pd).filter(([,v])=>v.status==='A').map(([n])=>n.split(' ').slice(0,2).join(' '));
      const pres=Object.values(pd).filter(v=>v.status==='P'||v.status==='E').length;
      if(aus.length)hasFalta=true;
      posHtml+='<div class="hist-turno-row"><span class="hist-turno-lbl">'+POSTOS_LABEL[posto]+'</span><div class="hist-ausentes">';
      if(aus.length){aus.forEach(n=>{posHtml+='<span class="hist-ausente-tag">'+n+'</span>';});posHtml+='<span style="font-size:11px;color:var(--text2);margin-left:4px">'+pres+' pres.</span>';}
      else{posHtml+='<span class="hist-ok"><i class="ti ti-check" style="font-size:11px"></i> '+pres+' presente(s)</span>';}
      posHtml+='</div></div>';
    });
    if(!posHtml)return;
    html+='<div class="hist-day-card '+(hasFalta?'has-falta':'all-present')+'"><div class="hist-day-date">'+weekday+'</div>'+posHtml+'</div>';
  });
  cont.innerHTML=html;
}
function navPresHistMes(d){
  const [y,m]=presHistMes.split('-').map(Number);
  const nd=new Date(y,m-1+d,1);
  presHistMes=nd.getFullYear()+'-'+String(nd.getMonth()+1).padStart(2,'0');
  renderPresHist();
}

// === ABSENTEÍSMO ===
function renderAbsenteismo(){
  const cont=document.getElementById('abs-content');if(!cont)return;
  const dates=Object.keys(state.presencas).sort();
  if(!dates.length){cont.innerHTML='<div class="empty"><i class="ti ti-user-off"></i><h3>Nenhum dado de presença ainda</h3></div>';return;}

  const absMap={},diasMap={};
  dates.forEach(date=>{
    const presDay=state.presencas[date]||{};
    POSTOS.forEach(posto=>{
      const pd=presDay[posto]||{};
      Object.entries(pd).forEach(([nome,v])=>{
        if(!absMap[nome])absMap[nome]={faltas:0,presencas:0,extras:0,posto};
        if(!diasMap[nome])diasMap[nome]=0;
        diasMap[nome]++;
        if(v.status==='A')absMap[nome].faltas++;
        else if(v.status==='E')absMap[nome].extras++;
        else absMap[nome].presencas++;
      });
    });
  });

  const sorted=Object.entries(absMap).sort((a,b)=>b[1].faltas-a[1].faltas);
  const totalFaltas=sorted.reduce((s,[,d])=>s+d.faltas,0);
  const criticos=sorted.filter(([,d])=>{const t=diasMap[d.posto]||0;return t>0&&d.faltas/diasMap[_getNome(d)]>=.15;}).length;
  const atencao=sorted.filter(([,d])=>{const t=diasMap[_getNome(d)]||0;return t>0&&d.faltas/t>=.08&&d.faltas/t<.15;}).length;
  function _getNome(d){return sorted.find(([,dd])=>dd===d)?.[0]||'';}

  let html='<div class="sec">Histórico de absenteísmo</div>';
  html+='<div class="kpi-grid-4" style="margin-bottom:16px">';
  html+='<div class="kpi"><div class="kpi-lbl">Total faltas</div><div class="kpi-val red">'+totalFaltas+'</div><div class="kpi-sub">'+dates.length+' dia(s)</div></div>';
  const totalReg=sorted.reduce((s,[,d])=>s+diasMap[d.posto]||0,0);
  const mediaAbs=totalReg>0?Math.round(totalFaltas/totalReg*100):0;
  html+='<div class="kpi"><div class="kpi-lbl">Média absenteísmo</div><div class="kpi-val '+(mediaAbs>=15?'red':mediaAbs>=8?'warn':'green')+'">'+mediaAbs+'%</div></div>';
  html+='<div class="kpi"><div class="kpi-lbl">Críticos ≥15%</div><div class="kpi-val red">'+criticos+'</div></div>';
  html+='<div class="kpi"><div class="kpi-lbl">Atenção ≥8%</div><div class="kpi-val warn">'+atencao+'</div></div>';
  html+='</div>';

  // By posto
  html+='<div class="card" style="margin-bottom:12px"><div class="card-title"><i class="ti ti-map-pin" style="color:var(--cyan)"></i>Faltas por posto</div>';
  html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px">';
  POSTOS.forEach(posto=>{
    let faltasP=0;
    Object.entries(absMap).forEach(([,d])=>{if(d.posto===posto)faltasP+=d.faltas;});
    html+='<div style="background:var(--bg3);border-radius:9px;padding:10px;text-align:center"><div style="font-size:11px;color:var(--text2);margin-bottom:4px">'+POSTOS_LABEL[posto]+'</div><div style="font-size:20px;font-weight:700;color:'+(faltasP>0?'var(--red)':'var(--green)')+'">'+faltasP+'</div></div>';
  });
  html+='</div></div>';

  // Ranking
  html+='<div class="card"><div class="card-title"><i class="ti ti-trophy" style="color:var(--cyan)"></i>Ranking por colaborador';
  html+='<button onclick="exportarAbsLins()" style="margin-left:auto;background:var(--cyan-bg);border:1px solid var(--cyan-bd);border-radius:7px;padding:5px 11px;color:var(--cyan);font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px"><i class="ti ti-download" style="font-size:12px"></i> Exportar</button></div>';

  sorted.forEach(([nome,d])=>{
    const total=diasMap[nome]||1;
    const pct=Math.round(d.faltas/total*100);
    const status=pct>=15?'CRÍTICO':pct>=8?'ATENÇÃO':'OK';
    const statusCls=pct>=15?'b-err':pct>=8?'b-warn':'b-ok';
    const barColor=pct>=15?'var(--red)':pct>=8?'var(--warn)':'var(--green)';
    html+='<div class="abs-row">';
    html+='<div style="min-width:140px;max-width:200px"><div style="font-size:13px;font-weight:700;color:var(--text)">'+nome+'</div>';
    html+='<div style="font-size:10px;color:var(--text2)">'+POSTOS_LABEL[d.posto]+'</div></div>';
    html+='<div class="abs-bar-wrap"><div class="abs-bar" style="width:'+pct+'%;background:'+barColor+'"></div></div>';
    html+='<div style="text-align:right;min-width:80px"><div style="font-size:12px;font-weight:700;color:var(--text)">'+d.faltas+' falta(s)</div><div style="font-size:11px;color:var(--text2)">'+d.presencas+' pres.'+(d.extras?' · '+d.extras+' extra':'')+'</div></div>';
    html+='<div style="min-width:70px;text-align:right"><span class="badge '+statusCls+'">'+status+'</span><div style="font-size:11px;color:var(--text2);margin-top:2px">'+pct+'%</div></div>';
    html+='</div>';
  });
  html+='</div>';
  cont.innerHTML=html;
}

function exportarAbsLins(){
  const dates=Object.keys(state.presencas).sort();
  const absMap={},diasMap={};
  dates.forEach(date=>{
    const presDay=state.presencas[date]||{};
    POSTOS.forEach(posto=>{
      Object.entries(presDay[posto]||{}).forEach(([nome,v])=>{
        if(!absMap[nome])absMap[nome]={faltas:0,presencas:0,extras:0,posto};
        if(!diasMap[nome])diasMap[nome]=0;
        diasMap[nome]++;
        if(v.status==='A')absMap[nome].faltas++;
        else if(v.status==='E')absMap[nome].extras++;
        else absMap[nome].presencas++;
      });
    });
  });
  let csv='Colaborador,Posto,Faltas,Presencas,Extras,Total,% Ausencia,Status\n';
  Object.entries(absMap).sort((a,b)=>b[1].faltas-a[1].faltas).forEach(([nome,d])=>{
    const total=diasMap[nome]||0;
    const pct=total>0?Math.round(d.faltas/total*100):0;
    const status=pct>=15?'CRITICO':pct>=8?'ATENCAO':'OK';
    csv+='"'+nome+'","'+POSTOS_LABEL[d.posto]+'",'+d.faltas+','+d.presencas+','+d.extras+','+total+','+pct+'%,'+status+'\n';
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='marilia_ops_absenteismo_'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);
  showToast('Exportado!','ok');
}
</script>

<script>

  if(canDelete){

// === MODAL COLABORADOR ===
function toggleCicloCalendar(idx){
  const el=document.getElementById('cal-'+idx);
  if(!el)return;
  const isOpen=el.classList.contains('open');
  el.classList.toggle('open');
  if(!isOpen && el.innerHTML===''){
    const colabIdx=idx;
    const c=state.colaboradores[colabIdx];
    if(!c)return;
    if(!c.inicioCiclo){
      el.innerHTML='<div style="font-size:11px;color:var(--text3);padding:8px 0">Configure a data de inicio do ciclo para ver o calendario.</div>';
      return;
    }
    const dias=['Dom','Seg','Ter','Qua','Qui','Sex','Sab'];
    let html='<div class="ciclo-cal-title"><i class="ti ti-calendar" style="font-size:11px"></i> Proximos 14 dias</div>';
    html+='<div class="ciclo-days">';
    for(let offset=0;offset<14;offset++){
      const d=new Date();d.setDate(d.getDate()+offset);
      const yr=d.getFullYear();
      const mo=String(d.getMonth()+1).padStart(2,'0');
      const dy=String(d.getDate()).padStart(2,'0');
      const dStr=yr+'-'+mo+'-'+dy;
      const ciclo=calcCiclo(c,dStr);
      const trabalha=ciclo.trabalha;
      const isHoje=offset===0;
      html+='<div class="ciclo-day">';
      html+='<div class="ciclo-day-num '+(trabalha?'trabalha':'folga')+(isHoje?' hoje':'')+'">'+(d.getDate())+'</div>';
      html+='<div class="ciclo-day-lbl">'+dias[d.getDay()]+'</div>';
      html+='<div class="ciclo-day-status '+(trabalha?'t':'f')+'">'+(trabalha?'Trab':'Folga')+'</div>';
      html+='</div>';
    }
    html+='</div>';
    el.innerHTML=html;
  }
}

let _modalIdx=-1;
function openColabModal(idx){
  _modalIdx=idx;
  const isEdit=idx>=0;
  const c=isEdit?state.colaboradores[idx]:null;
  document.getElementById('modal-title-txt').textContent=isEdit?'Editar colaborador':'Novo colaborador';
  document.getElementById('modal-nome').value=isEdit?c.nome:'';
  document.getElementById('modal-posto').value=isEdit?c.posto:'Acim';
  document.getElementById('modal-jornada').value=isEdit?c.jornada:'D06';
  document.getElementById('modal-ciclo').value=isEdit?(c.inicioCiclo||''):'';
  document.getElementById('modal-cargo').value=isEdit?(c.cargo||'Controlador de Acesso'):'Controlador de Acesso';
  document.getElementById('modal-del-btn').style.display=(isEdit&&currentRole==='superadmin')?'block':'none';
  document.getElementById('colab-modal').style.display='flex';
  setTimeout(()=>document.getElementById('modal-nome').focus(),50);
}
function closeColabModal(){document.getElementById('colab-modal').style.display='none';}
async function saveColabModal(){
  const nome=document.getElementById('modal-nome').value.trim();
  if(!nome){document.getElementById('modal-nome').style.borderColor='var(--red)';return;}
  document.getElementById('modal-nome').style.borderColor='';
  const colab={
    nome,
    posto:document.getElementById('modal-posto').value,
    jornada:document.getElementById('modal-jornada').value,
    inicioCiclo:document.getElementById('modal-ciclo').value||'',
    cargo:document.getElementById('modal-cargo').value
  };
  if(_modalIdx>=0) state.colaboradores[_modalIdx]=colab;
  else state.colaboradores.push(colab);
  closeColabModal();
  showToast(_modalIdx>=0?'Colaborador atualizado!':'Colaborador adicionado!','ok');
  saveCache();await pushForceToCloud();renderEquipe();
}
async function deleteColabModal(){
  const c=state.colaboradores[_modalIdx];
  if(!confirm('Excluir '+c.nome+'? O histórico de presença será mantido e você pode restaurar depois em "Colaboradores excluídos".'))return;
  c.ativo=false;
  c.excluidoEm=new Date().toISOString();
  c.excluidoPor=currentUser?currentUser.user:'?';
  closeColabModal();
  showToast('Removido.','ok');
  saveCache();await pushForceToCloud();renderEquipe();
}
async function restaurarColab(idx){
  const c=state.colaboradores[idx];
  if(!c)return;
  if(!confirm('Restaurar '+c.nome+'?'))return;
  c.ativo=true;
  delete c.excluidoEm;
  delete c.excluidoPor;
  showToast(c.nome+' restaurado!','ok');
  saveCache();await pushForceToCloud();renderEquipe();
}

// Feriados management
function addFeriado(){
  const data=document.getElementById('feriado-data').value;
  const nome=document.getElementById('feriado-nome').value.trim();
  if(!data||!nome){showToast('Preencha data e nome.','warn');return;}
  const feriados=JSON.parse(localStorage.getItem('marilia_ops_feriados')||'[]');
  feriados.push({data,nome});feriados.sort((a,b)=>a.data.localeCompare(b.data));
  localStorage.setItem('marilia_ops_feriados',JSON.stringify(feriados));
  showToast('Feriado adicionado!','ok');renderConfig();
}
function removeFeriado(i){
  const feriados=JSON.parse(localStorage.getItem('marilia_ops_feriados')||'[]');
  feriados.splice(i,1);localStorage.setItem('marilia_ops_feriados',JSON.stringify(feriados));
  showToast('Removido.','ok');renderConfig();
}

// Override isFimSemanaOuFeriado to check custom feriados
const _origFDS=isFimSemanaOuFeriado;
window.isFimSemanaOuFeriado=function(dateStr){
  const dow=new Date(dateStr+'T12:00').getDay();
  if(dow===0||dow===6)return true;
  const feriados=JSON.parse(localStorage.getItem('marilia_ops_feriados')||'[]');
  return feriados.some(f=>f.data===dateStr);
};

function exportarCSVLins(){
  const dates=Object.keys(state.presencas).sort();

    const presDay=state.presencas[date]||{};

      Object.entries(presDay[posto]||{}).forEach(([nome,v])=>{
        csv+=date+','+POSTOS_LABEL[posto]+',"'+nome+'",'+v.status+','+(v.justificativa||'')+'\n';

    });
  });
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='marilia_ops_presenca_'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);
  showToast('CSV exportado!','ok');
}
function exportarJSONLins(){
  const blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='marilia_ops_backup_'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
}

const _notifFiredLins={};

function notifKeyLins(tipo,hora){return'marilia_ops_'+tipo+'_'+today()+'_'+hora;}
function jaDisparouLins(tipo,hora){const k=notifKeyLins(tipo,hora);return _notifFiredLins[k]||localStorage.getItem(k)==='1';}
function marcarDisparadoLins(tipo,hora){const k=notifKeyLins(tipo,hora);_notifFiredLins[k]=true;try{localStorage.setItem(k,'1');}catch(e){}}

async function enviarWhatsAppLins(linhas){
  const erros=[];
  for(const r of NOTIF_RECIPIENTS){
    if(!r.apikey)continue;
    const url='https://api.callmebot.com/whatsapp.php?phone='+r.phone+'&text='+encodeURIComponent(linhas.filter(Boolean).join('\n'))+'&apikey='+r.apikey;
    try{await fetch(url,{mode:'no-cors'});}catch(e){erros.push(r.nome);}
  }
  return erros;
}

function verificarAusenciaLins(){
  const todayD=today();
  const presDay=state.presencas[todayD]||{};
  let totalEsc=0,totalAus=0,ausentesInfo=[];
  POSTOS.forEach(posto=>{
    const escalados=colaboradoresAtivos().filter(c=>c.posto===posto&&deveTrabalharHoje(c,todayD));
    totalEsc+=escalados.length;
    escalados.forEach(c=>{
      const pres=presDay[posto]&&presDay[posto][c.nome];
      if(pres&&pres.status==='A'){totalAus++;ausentesInfo.push(c.nome.split(' ')[0]+' ('+POSTOS_LABEL[posto]+')');}
    });
  });
  const pct=totalEsc>0?totalAus/totalEsc:0;
  if(pct>=NOTIF_LINS_CONFIG.ausenciaLimite&&totalAus>0){
    const key='ausencia_lins_'+todayD+'_'+totalAus;
    if(!_notifFiredLins[key]){
      _notifFiredLins[key]=true;
      const hora=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
      enviarWhatsAppLins([
        'Marilia Ops - Ausencia alta',
        'Escalados: '+totalEsc+' | Ausentes: '+totalAus+' ('+Math.round(pct*100)+'%)',
        ausentesInfo.length?'Ausentes: '+ausentesInfo.join(', '):'',
        todayD.split('-').reverse().join('/')+' as '+hora
      ]);
    }
  }
}

async function enviarResumoPresencaLins(hora){
  if(jaDisparouLins('presenca',hora))return;
  marcarDisparadoLins('presenca',hora);
  const todayD=today();
  const presDay=state.presencas[todayD]||{};
  const label=hora===8?'08h (inicio)':'20h';
  let linhas=['Marilia Ops - Presenca '+label,'Data: '+todayD.split('-').reverse().join('/'),''];
  POSTOS.forEach(posto=>{
    const escalados=colaboradoresAtivos().filter(c=>c.posto===posto&&deveTrabalharHoje(c,todayD));
    if(!escalados.length)return;
    const presPostoData=presDay[posto]||{};
    const pres=escalados.filter(c=>presPostoData[c.nome]&&(presPostoData[c.nome].status==='P'||presPostoData[c.nome].status==='E')).length;
    const aus=escalados.filter(c=>presPostoData[c.nome]&&presPostoData[c.nome].status==='A').map(c=>c.nome.split(' ')[0]);
    linhas.push(POSTOS_LABEL[posto]+': '+pres+'/'+escalados.length+(aus.length?' | Ausentes: '+aus.join(', '):''));
  });
  await enviarWhatsAppLins(linhas);
}

function verificarNotificacoesLins(){
  if(!currentUser)return;
  const hora=new Date().getHours();
  const min=new Date().getMinutes();
  if(min>2)return;
  verificarAusenciaLins();
  if(NOTIF_LINS_CONFIG.horariosPresenca.includes(hora))enviarResumoPresencaLins(hora);
}
setInterval(verificarNotificacoesLins,60000);

async function testarNotifLins(){
  const result=document.getElementById('notif-lins-result');
  if(result){result.textContent='Enviando...';result.style.color='var(--warn)';}
  const erros=await enviarWhatsAppLins([
    'Marilia Ops - Teste de notificacao',
    'Se voce recebeu esta mensagem, as notificacoes estao funcionando!',
    new Date().toLocaleString('pt-BR')
  ]);
  if(result){
    if(erros.length){result.textContent='Erro ao enviar.';result.style.color='var(--red)';}
    else{result.textContent='Mensagem enviada! Verifique seu WhatsApp.';result.style.color='var(--green)';}
  }
}

// Date change detector
let _lastDate=today();
setInterval(()=>{const n=today();if(n!==_lastDate){_lastDate=n;renderAll();showToast('Novo dia detectado!','ok',4000);}},60000);
</script>
